name: Pet previews

permissions:
  contents: write
  deployments: write

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "pets/**"
      - "categories.json"
      - "scripts/generate-pet-previews.py"
      - "scripts/generate-readmes.mjs"
      - "scripts/validate-pets.mjs"
      - "requirements.txt"

concurrency:
  group: pet-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine catalog check scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch origin "$BASE_SHA" --depth=1
          fi
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          if grep -Eq '\.(md|json)$' /tmp/changed-files.txt; then
            echo "format=true" >> "$GITHUB_OUTPUT"
          else
            echo "format=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(pets/|categories\.json$|scripts/(generate-pet-previews\.py|generate-readmes\.mjs|validate-pets\.mjs|check-readme-locales\.mjs|install-pet\.(mjs|sh|ps1)|test/)|package(-lock)?\.json$|requirements\.txt$)' /tmp/changed-files.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No catalog-affecting files changed; skipping pet checks."
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.relevant == 'true' || steps.scope.outputs.format == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        if: steps.scope.outputs.relevant == 'true' || steps.scope.outputs.format == 'true'
        run: npm ci

      - name: Check changed Markdown and JSON formatting
        if: github.event_name == 'pull_request' && steps.scope.outputs.format == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA" HEAD -- '*.md' '*.json' \
            | xargs -0 npx prettier --check

      - name: Generate repository listings
        if: steps.scope.outputs.relevant == 'true'
        run: npm run readmes

      - name: Validate pull request payload
        if: github.event_name == 'pull_request' && steps.scope.outputs.relevant == 'true'
        run: |
          npm run validate:pr
          npx prettier --check \
            "pets/**/*.json" \
            categories.json \
            pets.json \
            README.md \
            "docs/{zh-CN,ko,ja,es}/README.md"
          node scripts/check-readme-locales.mjs

      - name: Find changed pets
        id: changed-pets
        if: github.event_name == 'pull_request' && steps.scope.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD -- 'pets/**' \
            | awk -F/ '$1 == "pets" && NF >= 3 { print $2 }' \
            | sort -u > /tmp/changed-pets.txt
          if [ -s /tmp/changed-pets.txt ]; then
            echo "has-pets=true" >> "$GITHUB_OUTPUT"
            printf 'Changed pets:\n'
            cat /tmp/changed-pets.txt
          else
            echo "has-pets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: github.event_name == 'pull_request' && steps.changed-pets.outputs.has-pets == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install preview dependencies
        if: github.event_name == 'pull_request' && steps.changed-pets.outputs.has-pets == 'true'
        run: python -m pip install -r requirements.txt

      - name: Generate pull request previews
        if: github.event_name == 'pull_request' && steps.changed-pets.outputs.has-pets == 'true'
        run: xargs python3 scripts/generate-pet-previews.py < /tmp/changed-pets.txt

      - name: Upload pull request previews
        if: github.event_name == 'pull_request' && steps.changed-pets.outputs.has-pets == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-pet-previews
          path: assets/previews/
          if-no-files-found: error
          retention-days: 14

      - name: Validate generated listings on main
        if: github.event_name == 'push'
        run: |
          npx prettier --check \
            "pets/**/*.json" \
            categories.json \
            pets.json \
            README.md \
            "docs/{zh-CN,ko,ja,es}/README.md"
          node scripts/check-readme-locales.mjs

      - name: Commit generated files on main
        id: commit-generated
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved ahead; regenerate from the latest main before publishing."
            git restore \
              README.md \
              docs/zh-CN/README.md \
              docs/ko/README.md \
              docs/ja/README.md \
              docs/es/README.md \
              pets.json
            git checkout -B main origin/main
            npm run readmes
            node scripts/check-readme-locales.mjs
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/zh-CN/README.md \
            docs/ko/README.md \
            docs/ja/README.md \
            docs/es/README.md \
            pets.json
          git diff --cached --quiet || git commit -m "chore: update generated previews and readmes"
          git push || {
            git pull --rebase origin main
            git push
          }

  web-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: "https://q.dog"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine web check scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch origin "$BASE_SHA" --depth=1
          fi
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          if grep -Eq '^(web/(app/|components/|lib/|public/|scripts/|eslint\.config\.mjs$|next\.config\.ts$|package(-lock)?\.json$|postcss\.config\.mjs$|tsconfig\.json$)|pets/|categories\.json$|collections\.json$|requests\.json$|scripts/(generate-pet-previews\.py|generate-readmes\.mjs)|requirements\.txt$)' /tmp/changed-files.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No web-affecting files changed; skipping web checks."
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Prepare generated catalog
        if: steps.scope.outputs.relevant == 'true'
        run: |
          npm ci
          npm run readmes

      - name: Install web dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: npm ci
        working-directory: web

      - name: Lint web
        if: steps.scope.outputs.relevant == 'true'
        run: npm run lint
        working-directory: web

      - name: Build web
        if: steps.scope.outputs.relevant == 'true'
        run: npm run build:pr
        working-directory: web

  deploy-web:
    if: github.event_name == 'push'
    needs: previews
    uses: ./.github/workflows/deploy-web.yml
    with:
      sync_catalog: true
      validate_catalog: true
    secrets: inherit
