name: Showcase finished pets
description: Share one or more completed Codex pets with the community
title: "[Showcase]: "
labels:
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        <!-- pet-flow: showcase -->
        Share one or more pets that are already complete and working in Codex. A showcase is for community discovery and feedback; it is not a catalog submission or an acceptance request. Use a pull request for each pet you want added to QDog.
  - type: textarea
    id: pet_names
    attributes:
      label: Pet name(s)
      description: List every character, mascot, creature, or concept included in this showcase.
      placeholder: |
        Misaka Mikoto
        Kuroko Shirai
    validations:
      required: true
  - type: textarea
    id: showcase_media
    attributes:
      label: Preview
      description: Add public image URLs, animation URLs, or image attachments that clearly show every finished pet, either individually or together.
      placeholder: Paste preview URLs or drag images here
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: About these pets
      description: Describe their visual styles, animations, creation process, shared theme, or anything you want the community to notice.
      placeholder: A V2 chibi collection with coordinated effects and complete look directions.
    validations:
      required: true
  - type: textarea
    id: pet_links
    attributes:
      label: Pet or project link(s)
      description: Optional. Link directly to QDog pages, public source repositories, project pages, or installation instructions. Do not use referral, shortened, or paid-download links.
      placeholder: |
        https://q.dog/pets/first-pet--author
        https://q.dog/pets/second-pet--author
  - type: textarea
    id: creator
    attributes:
      label: Creators and credits
      description: Credit the creator of every showcased pet and honestly identify important source or reference material.
      placeholder: List each pet with its creator and relevant source notes.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Pet runtime version
      options:
        - V1 only
        - V2 only
        - Mixed V1 and V2
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Primary category
      options:
        - Game Characters
        - Anime Characters
        - Original Characters
        - Mascots
        - Animals
        - Fantasy Creatures
        - Robots
        - Human Avatars
        - Memes
        - Objects & Props
        - Others
        - Multiple categories
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Showcase confirmation
      options:
        - label: Every showcased pet is complete enough to run in Codex, and the previews represent the finished results.
          required: true
        - label: I have the right to share these materials and have provided truthful creator and source credits for every showcased pet.
          required: true
        - label: I understand that this showcase does not submit any pet to the QDog catalog; catalog inclusion still requires a separate normal pull request or blocked-submission process for each pet.
          required: true
