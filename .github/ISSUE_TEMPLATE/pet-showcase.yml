name: Showcase a finished pet
description: Share a completed Codex pet with the community
title: "[Showcase]: "
labels:
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        <!-- pet-flow: showcase -->
        Share a pet that is already complete and working in Codex. A showcase is for community discovery and feedback; it is not a catalog submission or an acceptance request. Use a pull request when you want the pet added to QDog.
  - type: input
    id: pet_name
    attributes:
      label: Pet name
      description: The character, mascot, creature, or concept shown by this pet.
      placeholder: Misaka Mikoto
    validations:
      required: true
  - type: textarea
    id: showcase_media
    attributes:
      label: Preview
      description: Add at least one public image URL, animation URL, or image attachment that shows the finished pet.
      placeholder: Paste a preview URL or drag an image here
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: About this pet
      description: Describe its visual style, animations, creation process, or anything you want the community to notice.
      placeholder: A compact V2 chibi pet with electric effects and 16 look directions.
    validations:
      required: true
  - type: input
    id: pet_url
    attributes:
      label: Pet or project link
      description: Optional. Link directly to its QDog page, public source repository, project page, or installation instructions. Do not use referral, shortened, or paid-download links.
      placeholder: https://q.dog/pets/pet-slug--author-slug
  - type: input
    id: creator
    attributes:
      label: Creator and credits
      description: Credit the pet creator and honestly identify important source or reference material.
      placeholder: Created by @your-name; independently generated fan art based on...
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Pet runtime version
      options:
        - V1
        - V2
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Primary category
      options:
        - Game Characters
        - Anime Characters
        - Original Characters
        - Mascots
        - Animals
        - Fantasy Creatures
        - Robots
        - Human Avatars
        - Memes
        - Objects & Props
        - Others
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Showcase confirmation
      options:
        - label: This pet is complete enough to run in Codex, and the preview represents the finished result.
          required: true
        - label: I have the right to share this material and have provided truthful creator and source credits.
          required: true
        - label: I understand that this showcase does not submit the pet to the QDog catalog; catalog inclusion still requires the normal pull request or blocked-submission process.
          required: true
